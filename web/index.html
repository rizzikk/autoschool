  <style>
    html, body { margin: 0; height: 100%; background: #fdfbff; }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px;
      background: #fdfbff; color: #3f51b5;
      font-family: Roboto, 'Segoe UI', Arial, sans-serif;
      transition: opacity .25s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash svg { width: 56px; height: 56px; fill: currentColor; }
    #splash h1 { margin: 0; font-size: 28px; font-weight: 500; }
    #splash p { margin: 0; font-size: 14px; color: #5b5d72; }
    #splash .spin {
      width: 36px; height: 36px; margin-top: 8px;
      border: 4px solid #dfe0ff; border-top-color: #3f51b5; border-radius: 50%;
      animation: splash-spin 0.9s linear infinite;
    }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      html, body, #splash { background: #1b1b1f; }
      #splash { color: #b9c3ff; }
      #splash p { color: #c5c6d0; }
      #splash .spin { border-color: #3a3c52; border-top-color: #b9c3ff; }
    }
    @media (prefers-reduced-motion: reduce) { #splash .spin { animation-duration: 3s; } }
  </style>
</head>
